<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salón de Belleza | Reservas y Citas</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel for in-browser client rendering -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [services, setServices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedService, setSelectedService] = useState(null);
      const [bookingSuccess, setBookingSuccess] = useState(null);
      const [formData, setFormData] = useState({
        customerName: '',
        customerEmail: '',
        customerPhone: '',
        date: new Date().toISOString().split('T')[0],
        time: '10:00',
        specialistName: 'Especialista Principal',
        notes: ''
      });

      useEffect(() => {
        fetch('/api/catalog/services')
          .then(res => res.json())
          .then(data => {
            setServices(data);
            setLoading(false);
          })
          .catch(err => {
            console.error("Error cargando servicios:", err);
            // Fallback de demostración si la BD aún no tiene conexión
            setServices([
              { id: 1, name: 'Manicure Rusa + Semipermanente', price: 55.00, durationMinutes: 60, description: 'Limpieza profunda de cutículas y esmaltado de alta duración.' },
              { id: 2, name: 'Uñas Acrílicas Esculpidas', price: 120.00, durationMinutes: 120, description: 'Extensión de uñas con acabado natural y diseño personalizado.' },
              { id: 3, name: 'Pedicure Spa Completo', price: 70.00, durationMinutes: 75, description: 'Exfoliación, hidratación profunda y masaje relajante.' },
              { id: 4, name: 'Botox Capilar Reparador', price: 150.00, durationMinutes: 90, description: 'Tratamiento reconstructor para cabello seco o maltratado.' }
            ]);
            setLoading(false);
          });
      }, []);

      const handleBookSubmit = async (e) => {
        e.preventDefault();
        const startDateTime = `${formData.date}T${formData.time}:00`;
        const payload = {
          customerName: formData.customerName,
          customerEmail: formData.customerEmail,
          customerPhone: formData.customerPhone,
          serviceId: selectedService.id,
          specialistName: formData.specialistName,
          startTime: startDateTime,
          notes: formData.notes
        };

        try {
          const res = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          setBookingSuccess(result);
        } catch (err) {
          alert('Hubo un problema registrando tu cita. Intenta nuevamente.');
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header */}
          <header class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <span class="text-2xl">✨</span>
                <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-rose-500 to-violet-600 bg-clip-text text-transparent">
                  Salón & Spa Elite
                </span>
              </div>
              <div class="flex items-center space-x-4 text-sm font-medium text-slate-600">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                  ● K3s + Istio + Quarkus
                </span>
              </div>
            </div>
          </header>

          {/* Hero */}
          <section class="relative py-12 md:py-16 bg-gradient-to-b from-rose-50/50 to-transparent">
            <div class="max-w-4xl mx-auto px-4 text-center">
              <span class="text-xs font-bold uppercase tracking-widest text-rose-600 bg-rose-100 px-3 py-1 rounded-full">
                Reservas en Línea
              </span>
              <h1 class="mt-4 text-4xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
                Elige tu servicio y agenda tu cita al instante
              </h1>
              <p class="mt-3 text-lg text-slate-600">
                Cuidado profesional para manos, pies y cabello. Pagos seguros con Mercado Pago y Yape.
              </p>
            </div>
          </section>

          {/* Servicios */}
          <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              {services.map(srv => (
                <div key={srv.id} class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <span class="text-2xl">💅</span>
                      <span class="text-xs font-semibold px-2 py-1 bg-slate-100 text-slate-700 rounded-lg">
                        ⏱ {srv.durationMinutes} min
                      </span>
                    </div>
                    <h3 class="mt-4 font-bold text-slate-900 text-lg">{srv.name}</h3>
                    <p class="mt-2 text-sm text-slate-500 line-clamp-3">{srv.description}</p>
                  </div>
                  <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div>
                      <span class="text-xs text-slate-400">Total</span>
                      <p class="font-extrabold text-xl text-slate-900">S/ {parseFloat(srv.price).toFixed(2)}</p>
                    </div>
                    <button 
                      onClick={() => { setSelectedService(srv); setBookingSuccess(null); }}
                      class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-xl shadow-sm transition">
                      Reservar
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Modal de Reserva */}
          {selectedService && (
            <div class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button 
                  onClick={() => setSelectedService(null)} 
                  class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold">
                  ×
                </button>

                {!bookingSuccess ? (
                  <form onSubmit={handleBookSubmit}>
                    <h2 class="text-xl font-bold text-slate-900">Agendar Cita</h2>
                    <p class="text-sm text-rose-600 font-semibold mt-1">
                      {selectedService.name} - S/ {parseFloat(selectedService.price).toFixed(2)}
                    </p>

                    <div class="mt-4 space-y-4">
                      <div>
                        <label class="block text-xs font-semibold text-slate-700">Tu Nombre Completo</label>
                        <input required type="text" value={formData.customerName} onChange={e => setFormData({...formData, customerName: e.target.value})} class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" placeholder="Ej. Ana Pérez" />
                      </div>
                      <div class="grid grid-cols-2 gap-3">
                        <div>
                          <label class="block text-xs font-semibold text-slate-700">Email</label>
                          <input required type="email" value={formData.customerEmail} onChange={e => setFormData({...formData, customerEmail: e.target.value})} class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" placeholder="ana@gmail.com" />
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700">Teléfono / WhatsApp</label>
                          <input required type="tel" value={formData.customerPhone} onChange={e => setFormData({...formData, customerPhone: e.target.value})} class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" placeholder="987654321" />
                        </div>
                      </div>
                      <div class="grid grid-cols-2 gap-3">
                        <div>
                          <label class="block text-xs font-semibold text-slate-700">Fecha</label>
                          <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" />
                        </div>
                        <div>
                          <label class="block text-xs font-semibold text-slate-700">Hora</label>
                          <input required type="time" value={formData.time} onChange={e => setFormData({...formData, time: e.target.value})} class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" />
                        </div>
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700">Notas o Preferencias</label>
                        <textarea value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} rows="2" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-rose-500 outline-none" placeholder="Color de esmalte, alergias, etc."></textarea>
                      </div>
                    </div>

                    <div class="mt-6 flex justify-end space-x-3">
                      <button type="button" onClick={() => setSelectedService(null)} class="px-4 py-2 border border-slate-300 text-slate-600 rounded-xl text-sm font-semibold hover:bg-slate-50">Cancelar</button>
                      <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-bold shadow-md">Confirmar Reserva</button>
                    </div>
                  </form>
                ) : (
                  <div class="text-center py-6">
                    <span class="text-5xl">🎉</span>
                    <h3 class="mt-4 text-2xl font-bold text-slate-900">¡Cita Pre-Agendada!</h3>
                    <p class="mt-2 text-sm text-slate-600">
                      Cita <b>#{bookingSuccess.id}</b> para <b>{formData.customerName}</b>.
                    </p>
                    <div class="mt-6 p-4 bg-rose-50 rounded-xl border border-rose-200 text-left">
                      <span class="text-xs font-bold text-rose-700 uppercase">Siguiente Paso: Pago con Mercado Pago</span>
                      <p class="text-xs text-rose-600 mt-1">
                        Puedes pagar con Tarjeta o Yape para confirmar tu cupo.
                      </p>
                      <button class="mt-3 w-full py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl text-sm shadow">
                        Pagar S/ {parseFloat(selectedService.price).toFixed(2)} con Mercado Pago
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="bg-white border-t border-slate-200 py-6 mt-12">
            <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-400">
              Salón de Belleza Monolito Modular • Quarkus 3 + React + Istio + K3s
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
