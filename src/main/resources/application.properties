# ==============================================================================
# SALON APP - QUARKUS CONFIGURATION
# ==============================================================================

quarkus.application.name=salon-app
quarkus.application.version=1.0.0-SNAPSHOT

# --- Database & Hibernate ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# En desarrollo si no hay K8s, Quarkus DevServices puede levantar Postgres automáticamente
# En producción (K8s) se inyectan variables de entorno estándar:
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
quarkus.hibernate-orm.database.generation=none

# --- Flyway Migrations ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- Container Image (Jib) ---
quarkus.container-image.builder=jib
quarkus.container-image.group=halvarezdev
quarkus.container-image.name=salon-app
quarkus.container-image.registry=ghcr.io
quarkus.jib.base-jvm-image=eclipse-temurin:21-jre-alpine

# --- Health & Observability (Prometheus / Loki) ---
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# --- Integraciones de Pago ---
salon.payment.mercadopago.token=${MERCADO_PAGO_TOKEN:}
salon.payment.culqi.secret-key=${CULQI_SECRET_KEY:}
